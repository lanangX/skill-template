<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hero 3D</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";

const TAU = Math.PI * 2;
const THEMES = {
  dark:  { body: 0x0f2f2c, edge: 0x2dd4bf, accent: 0xf59e0b, alt: 0x5eead4, ring: 0x134e4a, glow: "45,212,191", glowAlpha: 0.30, additive: true,  paper: "#0b1f1e", ink: "#e6fffb", dim: "#5f9a93", bar: "#14b8a6" },
  light: { body: 0xffffff, edge: 0x0f766e, accent: 0xd97706, alt: 0x0d9488, ring: 0x99d5cc, glow: "20,184,166", glowAlpha: 0.16, additive: false, paper: "#ffffff", ink: "#0b3b36", dim: "#5b8a84", bar: "#0f766e" }
};

function roundedShape(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function paperTexture(T) {
  const c = document.createElement("canvas"); c.width = 512; c.height = 640;
  const g = c.getContext("2d");
  g.fillStyle = T.paper; g.fillRect(0, 0, 512, 640);
  g.fillStyle = T.bar; g.fillRect(0, 0, 512, 78);
  g.fillStyle = "#ffffff"; g.font = "700 40px 'Segoe UI', system-ui, sans-serif"; g.textBaseline = "middle";
  g.fillText("SKILL.md", 36, 40);
  g.fillStyle = T.dim; g.font = "500 28px ui-monospace, Menlo, Consolas, monospace";
  g.fillText("---", 36, 128);
  g.fillStyle = T.ink; g.fillText("name: my-skill", 36, 176);
  g.fillStyle = T.dim; g.fillText("description: ...", 36, 224);
  g.fillText("---", 36, 272);
  const rows = [[0.92, T.bar], [0.74, T.dim], [0.86, T.dim], [0.55, T.dim], [0.8, T.bar], [0.64, T.dim], [0.7, T.dim]];
  rows.forEach(([w, col], i) => { g.fillStyle = col; g.globalAlpha = col === T.bar ? 0.9 : 0.45; g.fillRect(36, 316 + i * 40, 440 * w, 12); });
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

function glowTexture(T) {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, `rgba(${T.glow},${T.glowAlpha})`); grd.addColorStop(1, `rgba(${T.glow},0)`);
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
}

window.setup = (mode, W, H) => {
  const T = THEMES[mode];
  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
  camera.position.set(0, 1.4, 10.5); camera.lookAt(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, mode === "dark" ? 0.9 : 1.4));
  const key = new THREE.DirectionalLight(0xffffff, mode === "dark" ? 2.2 : 2.0); key.position.set(4, 6, 8); scene.add(key);
  const rim = new THREE.PointLight(T.edge, mode === "dark" ? 60 : 10, 30); rim.position.set(-5, 2, -3); scene.add(rim);

  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(T), transparent: true, depthWrite: false, blending: T.additive ? THREE.AdditiveBlending : THREE.NormalBlending }));
  glow.scale.set(16, 8, 1); glow.position.z = -2; scene.add(glow);

  const deck = new THREE.Group(); deck.scale.setScalar(1.3); scene.add(deck);
  const plateGeo = new THREE.ExtrudeGeometry(roundedShape(2.5, 3.1, 0.22), { depth: 0.1, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3 });
  const edgeGeo = new THREE.EdgesGeometry(plateGeo, 40);
  const plates = [];
  for (let i = 0; i < 3; i++) {
    const g = new THREE.Group();
    const top = i === 2;
    const mat = new THREE.MeshStandardMaterial({ color: T.body, roughness: 0.45, metalness: mode === "dark" ? 0.35 : 0.05, transparent: !top, opacity: top ? 1 : 0.9 });
    g.add(new THREE.Mesh(plateGeo, mat));
    g.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: T.edge, transparent: true, opacity: top ? 1 : 0.7 })));
    if (top) {
      const face = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 2.3 * 640 / 512 * (2.9 / 2.3) * 0.62), new THREE.MeshBasicMaterial({ map: paperTexture(T), transparent: true }));
      face.position.z = 0.141; g.add(face);
    }
    g.position.z = i * 0.62 - 0.62; deck.add(g); plates.push(g);
  }

  const orbit = [];
  const geos = [new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.OctahedronGeometry(0.36), new THREE.IcosahedronGeometry(0.34), new THREE.TetrahedronGeometry(0.42), new THREE.BoxGeometry(0.42, 0.42, 0.42)];
  const cols = [T.edge, T.accent, T.alt, T.accent, T.edge];
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(geos[i], new THREE.MeshStandardMaterial({ color: cols[i], roughness: 0.3, metalness: mode === "dark" ? 0.4 : 0.1, emissive: mode === "dark" ? cols[i] : 0x000000, emissiveIntensity: 0.35 }));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geos[i]), new THREE.LineBasicMaterial({ color: mode === "dark" ? 0xffffff : 0x083344, transparent: true, opacity: 0.55 })));
    scene.add(m); orbit.push(m);
  }

  const pts = [];
  const ringPts = []; for (let i = 0; i <= 128; i++) { const a = i / 128 * TAU; ringPts.push(new THREE.Vector3(Math.cos(a) * 7.3, 0, Math.sin(a) * 2.6)); }
  const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), new THREE.LineBasicMaterial({ color: T.ring, transparent: true, opacity: 0.8 }));
  ring.rotation.z = 0.12; scene.add(ring);

  const dots = new THREE.Group(); scene.add(dots);
  const dotMat = new THREE.MeshBasicMaterial({ color: T.alt, transparent: true, opacity: mode === "dark" ? 0.8 : 0.55 });
  for (let i = 0; i < 26; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.03 + (i % 3) * 0.015, 8, 8), dotMat);
    const a = (i * 2.399) % TAU, r = 2.2 + (i * 0.37) % 3.2;
    m.userData = { x: Math.cos(a) * r * 2.3, y: ((i * 0.61) % 3) - 1.5, z: Math.sin(a) * r * 0.6, p: i / 26 };
    dots.add(m);
  }

  window.frame = (t) => {
    deck.rotation.y = Math.sin(t * TAU) * 0.55;
    deck.rotation.x = -0.12 + Math.sin(t * TAU + 1.2) * 0.05;
    deck.position.y = Math.sin(t * TAU * 2) * 0.06;
    plates.forEach((g, i) => { g.position.y = Math.sin(t * TAU * 2 + i * 0.9) * 0.05; });
    orbit.forEach((m, i) => {
      const a = t * TAU + (i / 5) * TAU;
      m.position.set(Math.cos(a) * 7.3, Math.sin(a * 2) * 0.35 + Math.sin(a) * 0.25, Math.sin(a) * 2.6);
      m.rotation.x = t * TAU * (i % 2 ? 1 : 2); m.rotation.y = t * TAU * (i % 3 + 1);
    });
    dots.children.forEach(d => { const u = d.userData; d.position.set(u.x, u.y + Math.sin((t + u.p) * TAU) * 0.18, u.z); });
    glow.material.opacity = 0.9 + Math.sin(t * TAU * 2) * 0.1;
    renderer.render(scene, camera);
    return canvas.toDataURL("image/png");
  };
  return true;
};
window.ready = true;
</script>
</body>
</html>
